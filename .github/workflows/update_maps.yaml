name: Weekly Conservation Map Update

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Incremental Sync and Map Build
        run: python build_maps.py

      - name: Commit and push updated data and maps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bexar_rolling_12mo.parquet map_richness_gaps.html map_conservation_threats.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated weekly sync [skip ci]" && git push)
