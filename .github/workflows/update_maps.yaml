name: Monthly Conservation Map Update

on:
  schedule:
    # Runs at 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  # Allows you to trigger the update manually anytime from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch iNaturalist Data and Rebuild Maps
        run: python build_maps.py

      - name: Commit and push updated HTML maps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add map_richness_gaps.html map_conservation_threats.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated monthly map update [skip ci]" && git push)
