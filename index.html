<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bexar County Conservation & Biodiversity Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #1e293b;
      color: #f8fafc;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }
    .branding h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f1f5f9;
    }
    .branding p {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid #475569;
      border-radius: 6px;
      background-color: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background-color: #334155;
      color: #ffffff;
    }
    .tab-btn.active {
      background-color: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }
    #map-frame {
      width: 100%;
      flex-grow: 1;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="branding">
      <h1>Bexar County Ecological Monitoring</h1>
      <p>Texas Master Naturalist Conservation Analytics • Powered by iNaturalist</p>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="loadMap('map_richness_gaps.html', this)">
        Biodiversity & Survey Gaps
      </button>
      <button class="tab-btn" onclick="loadMap('map_conservation_threats.html', this)">
        Invasives vs. SGCN Threats
      </button>
    </div>
  </header>

  <!-- Default view loads map_richness_gaps.html on start -->
  <iframe id="map-frame" src="map_richness_gaps.html"></iframe>

  <script>
    function loadMap(pageUrl, buttonElement) {
      document.getElementById('map-frame').src = pageUrl + '?t=' + Date.now();
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');
    }
  </script>

</body>
</html>
